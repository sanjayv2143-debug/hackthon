<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofPath - AI Local Issue Reporting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🛡️ ProofPath</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link" href="{{ url_for('report') }}">Report Issue</a>
                <a class="nav-link" href="{{ url_for('track') }}">Track Status</a>
                <a class="nav-link btn btn-light text-primary ms-2 px-3 py-1 fw-bold" href="{{ url_for('admin_login') }}">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-4 text-muted bg-light mt-5 border-top">
        <p class="mb-0">ProofPath Hackathon Prototype &copy; 2026 | Powered by Flask & Ollama AI</p>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
