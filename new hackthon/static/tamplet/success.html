{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center text-center">
    <div class="col-md-6">
        <div class="card shadow border-0 p-5">
            <div class="display-1 text-success mb-3">✅</div>
            <h2 class="text-primary fw-bold">Complaint Submitted Successfully!</h2>
            <p class="text-muted">Ollama AI has analyzed your report and assigned it to the appropriate department.</p>
            <div class="alert alert-primary my-3 py-3">
                <span class="d-block text-secondary small">Your Unique Complaint ID:</span>
                <strong class="fs-3 text-dark">{{ cid }}</strong>
            </div>
            <a href="{{ url_for('track') }}" class="btn btn-primary mt-3">Track Complaint Status</a>
        </div>
    </div>
</div>
{% endblock %}
