{% extends "base.html" %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 shadow-sm border text-center">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold text-primary">Smart Local Issue Reporting</h1>
        <p class="col-md-8 fs-4 mx-auto text-secondary">Report civic problems instantly. AI automatically analyzes, categorizes, and assigns your issues to the correct municipal department.</p>
        <div class="mt-4">
            <a href="{{ url_for('report') }}" class="btn btn-primary btn-lg me-2 px-4 shadow">Report an Issue</a>
            <a href="{{ url_for('track') }}" class="btn btn-outline-secondary btn-lg px-4">Track Complaint</a>
        </div>
    </div>
</div>
{% endblock %}
